 hosts: master
  become: yes
  tasks:
    - name: Update apt cache
      apt: update_cache=yes
    - name: Install Java
      apt: name=openjdk-11-jdk state=present
    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
      notify: start jenkins
    - name: Install Terraform
      unarchive:
        src: https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
        dest: /usr/local/bin/
        remote_src: yes
        mode: '0755'
  handlers:
    - name: start jenkins
      service:
        name: jenkins
        state: started
        enabled: yes
